name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify wheel contains Python and Rust sources
        run: |
          python -c "import glob, zipfile; p=glob.glob('dist/*.whl')[0]; z=zipfile.ZipFile(p); names=set(z.namelist()); required={'aether_reasoner.py','aether_native.py','aether_native.rs'}; missing=required-names; assert not missing, f'Missing from wheel: {missing}'"
      - name: Run full test suite
        run: python -m unittest discover -v
