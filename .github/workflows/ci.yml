name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Install build tools and editable package
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify wheel contains package and native resources
        run: >-
          python -c "import glob, zipfile; p=glob.glob('dist/*.whl')[0]; names=set(zipfile.ZipFile(p).namelist()); required={'aether/__init__.py','aether/metrics.py','aether/native/bindings.py','aether/native/rust/aether_native.rs','aether/resources/datasets/manifests/phase5_datasets.json','aether_knowledge.py'}; missing=required-names; assert not missing, f'Missing from wheel: {missing}'"
      - name: Verify installed imports and resources
        run: >-
          python -c "import aether; from aether.native.bindings import compile_native; from importlib.resources import files; assert files('aether.native').joinpath('rust','aether_native.rs').is_file(); assert files('aether.resources.datasets').joinpath('manifests','phase5_datasets.json').is_file(); print(aether.__file__)"
      - name: Run full test suite including portability checks
        run: python -m unittest discover -v
